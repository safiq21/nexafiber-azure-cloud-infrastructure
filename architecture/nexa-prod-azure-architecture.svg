<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1600" height="1500" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="60" text-anchor="middle" font-size="38" font-weight="700" fill="#ffffff">NEXA-PROD · Azure Hub &amp; Spoke Architecture</text>
  <text x="800" y="95" text-anchor="middle" font-size="20" fill="#94a3b8">Network segmentation · Monitoring · Governance · FinOps</text>

  <!-- Internet -->
  <rect x="650" y="130" width="300" height="60" rx="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="800" y="168" text-anchor="middle" font-size="24" font-weight="600" fill="#e2e8f0">INTERNET</text>
  <line x1="800" y1="190" x2="800" y2="252" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Hub VNet -->
  <rect x="420" y="255" width="760" height="230" rx="16" fill="#0f2a44" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="800" y="292" text-anchor="middle" font-size="24" font-weight="700" fill="#7dd3fc">NEXA-PROD-HUB-VNET</text>
  <text x="800" y="318" text-anchor="middle" font-size="18" fill="#94a3b8">10.60.0.0/16</text>
  <rect x="630" y="340" width="340" height="120" rx="12" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text x="800" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#fecaca">AZURE FIREWALL</text>
  <text x="800" y="410" text-anchor="middle" font-size="18" fill="#fecaca">Standard</text>
  <text x="800" y="438" text-anchor="middle" font-size="18" fill="#fecaca">10.60.1.4</text>

  <!-- Peering -->
  <line x1="800" y1="485" x2="800" y2="576" stroke="#a78bfa" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M788,566 L800,580 L812,566 z" fill="#a78bfa"/>
  <rect x="720" y="516" width="160" height="34" rx="17" fill="#312e81" stroke="#a78bfa"/>
  <text x="800" y="539" text-anchor="middle" font-size="18" font-weight="600" fill="#ddd6fe">VNet Peering</text>

  <!-- App VNet -->
  <rect x="80" y="580" width="1440" height="470" rx="16" fill="#0f2f2a" stroke="#10b981" stroke-width="2.5"/>
  <text x="800" y="618" text-anchor="middle" font-size="24" font-weight="700" fill="#6ee7b7">NEXA-PROD-APP-VNET</text>
  <text x="800" y="644" text-anchor="middle" font-size="18" fill="#94a3b8">10.50.0.0/16</text>

  <!-- Web subnet -->
  <rect x="140" y="680" width="300" height="150" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="290" y="712" text-anchor="middle" font-size="20" font-weight="700" fill="#a7f3d0">WEB SUBNET</text>
  <text x="290" y="736" text-anchor="middle" font-size="16" fill="#94a3b8">10.50.10.0/24</text>
  <rect x="190" y="756" width="200" height="56" rx="8" fill="#0b1220" stroke="#34d399"/>
  <text x="290" y="781" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">WEB01</text>
  <text x="290" y="802" text-anchor="middle" font-size="15" fill="#94a3b8">10.50.10.4</text>

  <!-- App subnet -->
  <rect x="650" y="680" width="300" height="150" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="800" y="712" text-anchor="middle" font-size="20" font-weight="700" fill="#a7f3d0">APP SUBNET</text>
  <text x="800" y="736" text-anchor="middle" font-size="16" fill="#94a3b8">10.50.20.0/24</text>
  <rect x="700" y="756" width="200" height="56" rx="8" fill="#0b1220" stroke="#34d399"/>
  <text x="800" y="781" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">APP01</text>
  <text x="800" y="802" text-anchor="middle" font-size="15" fill="#94a3b8">10.50.20.4</text>

  <!-- Web -> App -->
  <line x1="440" y1="784" x2="648" y2="784" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arr)"/>
  <rect x="490" y="750" width="110" height="28" rx="14" fill="#0c4a6e"/>
  <text x="545" y="770" text-anchor="middle" font-size="16" font-weight="600" fill="#bae6fd">TCP 8080</text>

  <!-- DB subnet -->
  <rect x="1160" y="680" width="300" height="150" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="1310" y="712" text-anchor="middle" font-size="20" font-weight="700" fill="#a7f3d0">DB SUBNET</text>
  <text x="1310" y="736" text-anchor="middle" font-size="16" fill="#94a3b8">10.50.30.0/24</text>
  <rect x="1210" y="756" width="200" height="56" rx="8" fill="#0b1220" stroke="#34d399"/>
  <text x="1310" y="781" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">DB01</text>
  <text x="1310" y="802" text-anchor="middle" font-size="15" fill="#94a3b8">10.50.30.4</text>

  <!-- App -> DB -->
  <line x1="950" y1="784" x2="1158" y2="784" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arr)"/>
  <rect x="1000" y="750" width="110" height="28" rx="14" fill="#0c4a6e"/>
  <text x="1055" y="770" text-anchor="middle" font-size="16" font-weight="600" fill="#bae6fd">TCP 1433</text>

  <!-- Web -> DB blocked -->
  <path d="M290 830 L290 880 L1310 880 L1310 832" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 7"/>
  <circle cx="800" cy="880" r="20" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
  <text x="800" y="888" text-anchor="middle" font-size="24" font-weight="700" fill="#fecaca">✕</text>
  <text x="800" y="922" text-anchor="middle" font-size="18" font-weight="700" fill="#fca5a5">WEB → DB = BLOCKED</text>

  <!-- Mgmt subnet -->
  <rect x="140" y="940" width="300" height="80" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="290" y="975" text-anchor="middle" font-size="20" font-weight="700" fill="#a7f3d0">MGMT SUBNET</text>
  <text x="290" y="1000" text-anchor="middle" font-size="16" fill="#94a3b8">10.50.40.0/24</text>

  <!-- Controls -->
  <rect x="560" y="945" width="880" height="70" rx="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="1000" y="975" text-anchor="middle" font-size="20" font-weight="700" fill="#99f6e4">NSGs + ASGs + UDR</text>
  <text x="1000" y="1000" text-anchor="middle" font-size="18" fill="#ccfbf1">Traffic flow: WEB → APP → DB  (least-privilege segmentation)</text>

  <!-- Bottom row -->
  <!-- Operations -->
  <rect x="80" y="1090" width="460" height="300" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
  <text x="310" y="1130" text-anchor="middle" font-size="24" font-weight="700" fill="#c7d2fe">OPERATIONS</text>
  <text x="120" y="1180" font-size="20" font-weight="600" fill="#e0e7ff">Azure Monitor</text>
  <text x="140" y="1218" font-size="19" fill="#c7d2fe">├─ WEB01 CPU Alert</text>
  <text x="140" y="1250" font-size="19" fill="#c7d2fe">├─ APP01 CPU Alert</text>
  <text x="140" y="1282" font-size="19" fill="#c7d2fe">└─ DB01 CPU Alert</text>
  <rect x="115" y="1315" width="390" height="50" rx="10" fill="#0b1220" stroke="#818cf8"/>
  <text x="310" y="1347" text-anchor="middle" font-size="19" font-weight="600" fill="#e0e7ff">Log Analytics: NEXA-PROD-LOG</text>

  <!-- Governance -->
  <rect x="570" y="1090" width="460" height="300" rx="16" fill="#3b2a05" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="800" y="1130" text-anchor="middle" font-size="24" font-weight="700" fill="#fde68a">GOVERNANCE &amp; FINOPS</text>
  <text x="620" y="1185" font-size="20" fill="#fef3c7">•  RBAC</text>
  <text x="620" y="1223" font-size="20" fill="#fef3c7">•  Resource Tags</text>
  <text x="620" y="1261" font-size="20" fill="#fef3c7">•  Azure Policy</text>
  <text x="620" y="1299" font-size="20" fill="#fef3c7">•  Monthly Budget</text>
  <text x="620" y="1337" font-size="20" fill="#fef3c7">•  50% / 80% Cost Alerts</text>

  <!-- Decisions -->
  <rect x="1060" y="1090" width="460" height="300" rx="16" fill="#3f1d38" stroke="#f472b6" stroke-width="2.5"/>
  <text x="1290" y="1130" text-anchor="middle" font-size="24" font-weight="700" fill="#fbcfe8">ARCHITECTURE DECISION</text>
  <text x="1100" y="1195" font-size="20" font-weight="600" fill="#fce7f3">Load Balancer / HA</text>
  <text x="1100" y="1225" font-size="19" fill="#f9a8d4">→ Intentionally Deferred</text>
  <text x="1100" y="1290" font-size="20" font-weight="600" fill="#fce7f3">DCR / AMA</text>
  <text x="1100" y="1320" font-size="19" fill="#f9a8d4">→ Deferred</text>

  <text x="800" y="1450" text-anchor="middle" font-size="16" fill="#64748b">Microsoft Azure · Hands-on Lab · NEXA-PROD</text>
</svg>
